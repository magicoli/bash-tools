# Debian package of bash-tools, built by apt-package (apt-repo).
# ${VERSION} comes from the git tag. semver makes pre-releases sort before the
# release (1.0.0-beta.2 -> 1.0.0~beta.2).
name: bash-tools
arch: all
platform: linux
version: ${VERSION}
version_schema: semver
section: utils
priority: optional
maintainer: Magiiic <bagagiste@magiiic.com>
description: Eclectic collection of bash tools and helpers
homepage: https://github.com/magicoli/bash-tools
license: AGPL-3.0-or-later

depends:
  - bash
suggests:
  - espeak-ng | espeak
  - mailutils | bsd-mailx
  - wget

contents:
  # The tree in its own folder: bash-helpers finds its library from there
  - src: bin
    dst: /usr/share/bash-tools/bin
    type: tree
  - src: src
    dst: /usr/share/bash-tools/src
    type: tree
  # Profile, prompt and completion extras, not activated
  - src: etc
    dst: /usr/share/bash-tools/etc
    type: tree
  - src: README.md
    dst: /usr/share/doc/bash-tools/README.md
  - src: CHANGELOG.md
    dst: /usr/share/doc/bash-tools/CHANGELOG.md
  - src: LICENSE
    dst: /usr/share/doc/bash-tools/LICENSE

  # Commands, as exposed by composer.json
  - {
      type: symlink,
      src: /usr/share/bash-tools/bin/bash-helpers,
      dst: /usr/bin/bash-helpers,
    }
  - {
      type: symlink,
      src: /usr/share/bash-tools/bin/cpuinfo,
      dst: /usr/bin/cpuinfo,
    }
  - {
      type: symlink,
      src: /usr/share/bash-tools/bin/ini_parser,
      dst: /usr/bin/ini_parser,
    }
  - {
      type: symlink,
      src: /usr/share/bash-tools/bin/mail-report,
      dst: /usr/bin/mail-report,
    }
  - {
      type: symlink,
      src: /usr/share/bash-tools/bin/randompassword,
      dst: /usr/bin/randompassword,
    }
  - {
      type: symlink,
      src: /usr/share/bash-tools/bin/stamp,
      dst: /usr/bin/stamp,
    }
  - {
      type: symlink,
      src: /usr/share/bash-tools/bin/stampfile,
      dst: /usr/bin/stampfile,
    }
  - {
      type: symlink,
      src: /usr/share/bash-tools/bin/tildelete,
      dst: /usr/bin/tildelete,
    }
  - {
      type: symlink,
      src: /usr/share/bash-tools/bin/titlecase,
      dst: /usr/bin/titlecase,
    }
  - {
      type: symlink,
      src: /usr/share/bash-tools/bin/tts,
      dst: /usr/bin/tts,
    }
  - {
      type: symlink,
      src: /usr/share/bash-tools/bin/ucfirst,
      dst: /usr/bin/ucfirst,
    }
  - {
      type: symlink,
      src: /usr/share/bash-tools/bin/webnormalize,
      dst: /usr/bin/webnormalize,
    }
  - {
      type: symlink,
      src: /usr/share/bash-tools/bin/wtclient,
      dst: /usr/bin/wtclient,
    }
